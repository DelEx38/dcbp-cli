[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcbp-cli"
version = "0.1.0"
description = "DC Blueprint - Système de mémoire persistante et workflows structurés pour Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "DC", email = "dc@example.com"}
]
keywords = ["claude", "ai", "blueprint", "workflow", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
dcbp = "dcbp_cli.cli:main"

[project.urls]
Homepage = "https://github.com/DelEx38/dcbp-cli"
Repository = "https://github.com/DelEx38/dcbp-cli"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dcbp_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/dcbp_cli/templates" = "dcbp_cli/templates"

[tool.hatch.build]
include = [
    "src/dcbp_cli/**/*.py",
    "src/dcbp_cli/**/*.md",
    "src/dcbp_cli/**/.gitkeep",
]
